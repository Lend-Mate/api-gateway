spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8084

---
spring:
  config:
    activate:
      on-profile: dev
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

---
spring:
  config:
    activate:
      on-profile: prod
    import: "configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
