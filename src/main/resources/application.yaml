# application.yml
server:
  port: 8080 # The port for your API Gateway

springdoc:
  swagger-ui:
    urls:
      - name: product-service
        url: /product-service/v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      routes:
        - id: user_service_route
          uri: http://user-service:8080
          predicates:
            - Path=/auth/**,/user/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1 # her saniyede kaç tane request atma hakkı eklensin
                redis-rate-limiter.burstCapacity: 3 # maksimum request atma hakkı
                key-resolver: "#{@userKeyResolver}"
        - id: user_service_docs
          uri: http://user-service:8080
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        - id: product_service_route
          uri: http://product-service:8080
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/product-availability/**,/api/v1/product-image/**,/api/files/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"
        - id: product_service_docs
          uri: http://product-service:8080
          predicates:
            - Path=/product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/(?<segment>.*), /${segment}
