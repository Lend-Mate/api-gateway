# application.yml
server:
  port: 8080 # The port for your API Gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api/v3/api-docs/swagger-config
    urls:
      - name: product-service
        url: /api/product-service/v3/api-docs
      - name: user-service
        url: /api/user-service/v3/api-docs
  webjars:
    prefix: ""

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      routes:
        - id: user_service_route
          uri: http://user-service:8080
          predicates:
            - Path=/auth/**,/user/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1 # her saniyede kaç tane request atma hakkı eklensin
                redis-rate-limiter.burstCapacity: 3 # maksimum request atma hakkı
                key-resolver: "#{@userKeyResolver}"
        - id: user_service_docs
          uri: http://user-service:8080
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        - id: product_service_route
          uri: http://product-service:8080
          predicates:
            - Path=/products/**,/categories/**,/product-availability/**,/product-image/**,/favourites/**,/files/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"
        - id: product_service_docs
          uri: http://product-service:8080
          predicates:
            - Path=/product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/(?<segment>.*), /${segment}

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://178.104.91.123"
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600

gateway:
  security:
    enabled: false